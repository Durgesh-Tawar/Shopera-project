<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sopera - Premium Fashion</title>
  <link rel="stylesheet" href="/client/css/style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">SOPERA</div>

  <ul class="menu">
    <li class="dropdown">
      Men
      <div class="mega-menu">
        <div>
          <h4>Topwear</h4>
          <a href="#">T-Shirts</a>
          <a href="#">Shirts</a>
          <a href="#">Jackets</a>
        </div>
        <div>
          <h4>Bottomwear</h4>
          <a href="#">Jeans</a>
          <a href="#">Trousers</a>
        </div>
      </div>
    </li>
    <li>Women</li>
    <li>Kids</li>
  </ul>

  <div class="nav-right">
    <input type="text" placeholder="Search for products...">
    <div class="icons">
      <span id="darkToggle">🌙</span>
      <span>❤️</span>
      <span class="cart-icon">
        🛍
        <span class="cart-count" id="cartCount">0</span>
      </span>
    </div>
  </div>
</header>

<!-- HERO SLIDER -->
<section class="hero">
  <div class="slides">
    <div class="slide active"></div>
    <div class="slide"></div>
    <div class="slide"></div>
  </div>
  <div class="hero-content">
    <h1>New Collection 2026</h1>
    <p>Flat 50% Off</p>
    <button>Shop Now</button>
  </div>
</section>
<!-- TRENDING PRODUCTS -->
<section class="products">
  <h2 class="section-title">Trending Now</h2>
  <div class="product-grid" id="homeProducts"></div>
</section>

<script src="/client/js/app.js"></script>
</body>
</html>
