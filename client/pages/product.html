<!DOCTYPE html>
<html>
<head>
  <title>Products - Sopera</title>
  <link rel="stylesheet" href="/client/css/product.css">
</head>
<body>

<h2 style="padding:30px;">All Products</h2>

<div class="filter-bar">
  <select id="sort">
    <option value="">Sort By</option>
    <option value="low">Price: Low to High</option>
    <option value="high">Price: High to Low</option>
  </select>

  <input type="number" id="minPrice" placeholder="Min Price">
  <input type="number" id="maxPrice" placeholder="Max Price">
  <button onclick="applyFilter()">Apply</button>
</div>

<section class="product-grid" id="productContainer"></section>

<script src="/client/js/product.js"></script>
</body>
</html>
