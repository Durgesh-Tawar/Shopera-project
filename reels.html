<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOPERA - Reels Shop</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* Reels scroll section */
.reel-feed {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 10px;
    scroll-behavior: smooth;
}

.reel-card {
    position: relative;
    background: #f8f8f8;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.reel-card video {
    width: 100%;
    border-radius: 10px 10px 0 0;
}

.reel-card .reel-info {
    padding: 10px;
}

.reel-card .reel-info h3 {
    margin: 0 0 5px 0;
}

.reel-card .reel-info p {
    margin: 0 0 10px 0;
}

.reel-card .reel-info button {
    background: #ff3c78;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
}

.reel-card .reel-info button:hover {
    background: #e6326b;
}
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="logo">SOPERA</div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="mood.html">Mood</a></li>
        <li><a href="reels.html">Reels</a></li>
        <li><a href="spin.html">Spin & Win 🎁</a></li>
        <li><a href="cart.html">Cart 🛒</a></li>
        <li><a href="orders.html">Orders 📦</a></li>
        <li><a href="#">Profile 👤</a></li>
    </ul>
</nav>

<section class="products">
    <h2>Reels Shopping</h2>
    <div class="reel-feed" id="reelFeed">
        <!-- JS will render video reels here -->
    </div>
</section>

<script src="js/data.js"></script>
<script>
const reelFeed = document.getElementById("reelFeed");
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Render each product as a reel card
products.forEach(p => {
    const div = document.createElement("div");
    div.classList.add("reel-card");
    div.innerHTML = `
        <video src="${p.video}" autoplay muted loop></video>
        <div class="reel-info">
            <h3>${p.name}</h3>
            <p>₹${p.price}</p>
            <button onclick="addToCart(${p.id})">Add to Cart</button>
        </div>
    `;
    reelFeed.appendChild(div);
});

// Add to Cart
function addToCart(id){
    const product = products.find(p => p.id === id);
    cart.push(product);
    localStorage.setItem("cart", JSON.stringify(cart));
    alert(`${product.name} added to cart!`);
}
</script>
</body>
</html>
