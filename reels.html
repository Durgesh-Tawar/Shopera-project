<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPERA - Reels</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Reset & Base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            overflow: hidden;
        }
        
        /* Custom Scrollbar Hide */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Snap Scrolling */
        .reels-container {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            height: 100vh;
            overflow-y: scroll;
        }
        
        .reel-item {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            height: 100vh;
            width: 100%;
            background: #000;
            z-index: 1;
        }
        
        /* Active reel gets higher z-index to show above others */
        .reel-item.active {
            z-index: 10;
        }
        
        /* Video Styles */
        .reel-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        
        /* Video Fallback Background */
        .reel-video.fallback {
            background-size: cover;
            background-position: center;
        }
        
        /* Progress Bar */
        .progress-bar-container {
            position: absolute;
            bottom: 80px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
            z-index: 20;
        }
        
        .progress-bar-item {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: #fff;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .progress-bar-item.active .progress-bar-fill {
            background: #ff3f6c;
        }
        
        /* Heart Animation */
        @keyframes heartBeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1); }
            75% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        .heart-animation {
            animation: heartBeat 0.6s ease-in-out;
        }
        
        @keyframes doubleTapHeart {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
        
        .double-tap-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 25;
        }
        
        .double-tap-heart i {
            font-size: 8rem;
            color: white;
            opacity: 0;
        }
        
        .double-tap-heart.show i {
            animation: doubleTapHeart 0.8s ease-out forwards;
        }
        
        /* Spin Animation for Music Disc */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .disc-spin {
            animation: spin 3s linear infinite;
        }
        
        /* Mute Overlay */
        .tap-to-unmute {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            padding: 20px 30px;
            border-radius: 30px;
            color: white;
            z-index: 30;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .tap-to-unmute:hover {
            background: rgba(0,0,0,0.9);
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        .tap-to-unmute i {
            font-size: 1.25rem;
        }
        
        /* Comments Panel */
        .comments-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            max-height: 60vh;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 40;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
        }
        
        .comments-panel.active {
            transform: translateY(0);
        }
        
        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .comments-header h3 {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }
        
        .comments-header .close-btn {
            background: none;
            border: none;
            color: #999;
            font-size: 20px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }
        
        .comments-header .close-btn:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
        }
        
        .comment {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            position: relative;
        }
        
        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff3f6c, #ff6b9d);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            flex-shrink: 0;
            font-weight: 600;
        }
        
        .comment-content {
            flex: 1;
        }
        
        .comment-user {
            color: white;
            font-weight: 600;
            font-size: 13px;
        }
        
        .comment-text {
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            margin-top: 2px;
        }
        
        .comment-time {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            margin-top: 4px;
        }
        
        /* Delete Button for Comments */
        .comment-delete-btn {
            position: absolute;
            right: 0;
            top: 0;
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            padding: 5px;
            font-size: 12px;
            opacity: 0;
            transition: all 0.3s;
        }
        
        .comment:hover .comment-delete-btn {
            opacity: 1;
        }
        
        .comment-delete-btn:hover {
            color: #ff3f6c;
        }
        
        .comment-input {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .comment-input input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
        }
        
        .comment-input input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .comment-input button {

            border: none;
            border-radius: 25px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .comment-input button:hover {
            background: #ff6b9d;
        }
        
        /* Share Modal */
        .share-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);

            justify-content: center;
            z-index: 50;

        .share-modal.active {

        }
        
        .share-content {

            display: flex;

        }
        
        .share-header h3 {

        }
        
        .share-options {

        .share-option {

        .share-option:hover {

        .share-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;

            align-items: center;

            font-size: 20px;

        }
        
        .share-label {
            font-size: 12px;
            color: #666;
        }
        
        .share-link-input {

            border: none;
            border-radius: 10px;
            background: #f5f5f5;
            font-size: 14px;
            color: #333;
        }
        
        /* Follow Button */
        .follow-btn {
            background: #ff3f6c;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .follow-btn:hover {
            background: #ff6b9d;
        }
        
        .follow-btn.following {
            background: transparent;
            border: 1px solid white;
        }
        
        /* Loading Spinner */
        .video-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #ff3f6c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 10;
        }
        
        /* Back Button */
        .back-btn {
            position: absolute;
            top: 40px;
            left: 15px;
            z-index: 25;
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(0,0,0,0.8);
        }
        
        /* Global Mute Button */
        .mute-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;

            height: 44px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;

        .mute-btn:hover {

        .reels-nav {

            left: 50%;

            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);

            border-radius: 30px;

            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-size: 14px;
            text-decoration: none;

        .nav-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        /* Reel Overlay - Left Side */
        .reel-info {

            bottom: 80px;
            left: 15px;
            right: 70px;
            z-index: 20;
            color: white;
        }
        
        .reel-user {
            display: flex;
            align-items: center;
            gap: 10px;

            height: 40px;

            justify-content: center;

            font-size: 16px;

            align-items: center;
            gap: 5px;

            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);

            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            transition: all 0.3s;

        .action-btn:hover .action-icon {
            background: rgba(0,0,0,0.5);
            transform: scale(1.1);
        }

            color: #ff3f6c;
        }
        
        .action-label {
            color: white;
            font-size: 12px;
            font-weight: 500;
        }
        
        .music-disc {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
        
        .music-disc-inner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff3f6c, #ff6b9d);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }
        
        /* Mobile Responsive */
        @media (max-width: 480px) {
            .reel-info {
                right: 60px;
            }
            
            .reel-actions {
                right: 5px;
            }
            
            .action-icon {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
            
            .back-btn, .mute-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            
            .mute-btn {
                top: 15px;
                right: 15px;
            }
            
            .reels-nav {
                bottom: 15px;
                gap: 10px;
            }
            
            .nav-btn {
                padding: 10px 16px;
                font-size: 12px;
            }
        }
    </style>
</head>

        }
        
        // Filter comments for each reel - only keep comments that belong to that specific reel
        Object.keys(comments).forEach(reelId => {
            if (!Array.isArray(comments[reelId])) {
                comments[reelId] = [];
            } else {
                // Keep only comments that belong to this reel
                const targetReelId = parseInt(reelId);
                comments[reelId] = comments[reelId].filter(c => {
                    // If comment doesn't have reelId, assume it belongs to this reel (legacy support)
                    if (!c.reelId) return true;
                    const commentReelId = parseInt(c.reelId);
                    return commentReelId === targetReelId;
                });
            }
        });
        
        // Save the filtered comments back to localStorage to clean up any corrupted data
        localStorage.setItem('reelComments', JSON.stringify(comments));
        
        let currentShareProduct = null;
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let isTransitioning = false;
        
        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', () => {
            renderReels();
            setupScrollDetection();
            setupKeyboardNavigation();
            setupDoubleTap();
            setupIntersectionObserver(); // Add intersection observer for autoplay
            updateCartCount();
            updateMuteIcon();
            
            // Hide loading spinners after a timeout
            setTimeout(() => {
                document.querySelectorAll('.video-loading').forEach(el => el.style.display = 'none');
            }, 3000);
            
            // Attempt autoplay on load
            setTimeout(() => {
                playVisibleVideo();
                updateActiveReel(0);
            }, 500);
        });
        
        // ==================== ACTIVE REEL TRACKING ====================
        function updateActiveReel(index) {
            // Update currentReelIndex
            currentReelIndex = index;
            
            // Update z-index for all reels - active reel gets higher z-index
            document.querySelectorAll('.reel-item').forEach((reel, i) => {
                if (i === index) {
                    reel.classList.add('active');
                } else {
                    reel.classList.remove('active');
                }
            });
            
            // Close comments when switching to a different reel
            if (openCommentsReelId !== null && openCommentsReelId !== reelsData[index]?.id) {
                closeAllComments();
            }
        }
        
        // ==================== RENDER FUNCTIONS ====================
        function renderReels() {
            const container = document.getElementById('reelsContainer');
            container.innerHTML = reelsData.map((reel, index) => createReelHTML(reel, index)).join('');
        }
        
        function createReelHTML(reel, index) {
            const isLiked = likedPosts.includes(reel.id);
            const isFollowing = followedUsers.includes(reel.username.replace('@', ''));
            // Get comments specifically for this reel
            const reelComments = comments[reel.id] || [];
            
            return `
                <div class="reel-item" data-index="${index}" data-id="${reel.id}">
                    <!-- Video Loading -->
                    <div class="video-loading"></div>
                    
                    <!-- Video -->
                    <video 
                        class="reel-video" 
                        id="video-${reel.id}"
                        src="${reel.video}"
                        poster="${reel.image}"
                        loop
                        playsinline
                        muted="${isMuted}"
                        data-index="${index}"
                        preload="metadata"
                    ></video>
                    
                    <!-- Double Tap Heart -->
                    <div class="double-tap-heart" id="doubleTapHeart-${reel.id}">
                        <i class="fas fa-heart"></i>
                    </div>
                    
                    <!-- Mute Overlay (shown when muted) -->
                    ${isMuted ? `
                        <div class="tap-to-unmute" onclick="unmuteVideo(${reel.id})">
                            <i class="fas fa-volume-mute"></i>
                            <span>Tap to unmute</span>
                        </div>
                    ` : ''}
                    
                    <!-- Progress Bars -->
                    <div class="progress-bar-container">
                        ${reelsData.map((_, i) => `
                            <div class="progress-bar-item ${i === index ? 'active' : ''}">
                                <div class="progress-bar-fill" id="progress-${reel.id}-${i}"></div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <!-- Left Side - Product Info -->
                    <div class="reel-info">
                        <div class="reel-user">
                            <div class="reel-avatar">${reel.username.charAt(1).toUpperCase()}</div>
                            <span class="reel-username">${reel.username}</span>
                            <button class="follow-btn ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${reel.username.replace('@', '')}', this)">
                                ${isFollowing ? 'Following' : 'Follow'}
                            </button>
                        </div>
                        
                        <p class="reel-description">${reel.description}</p>
                        
                        <div class="reel-hashtags">
                            ${reel.hashtags.map(tag => `<span>#${tag}</span>`).join('')}
                        </div>
                        
                        <a href="${reel.productLink}" class="shop-now-btn">
                            <span>Shop Now</span>
                            <span class="price">${reel.price}</span>
                            <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                    
                    <!-- Right Side - Actions -->
                    <div class="reel-actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${reel.id}, this)">
                            <div class="action-icon">
                                <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>
                            </div>
                            <span class="action-label">${formatNumber(reel.likes + (isLiked ? 1 : 0))}</span>
                        </button>
                        
                        <button class="action-btn" onclick="showComments(${reel.id})">
                            <div class="action-icon">
                                <i class="far fa-comment"></i>
                            </div>
                            <span class="action-label">${formatNumber(reel.comments + reelComments.length)}</span>
                        </button>
                        
                        <button class="action-btn" onclick="openShareModal(${reel.id}, '${reel.brand}', '${reel.price}')">
                            <div class="action-icon">
                                <i class="fas fa-paper-plane"></i>
                            </div>
                            <span class="action-label">${formatNumber(reel.shares)}</span>
                        </button>
                        
                        <div class="music-disc">
                            <div class="music-disc-inner disc-spin">
                                <i class="fas fa-music"></i>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Comments Panel - Each reel has its own panel positioned absolutely within the reel -->
                    <div class="comments-panel" id="comments-${reel.id}">
                        <div class="comments-header">
                            <h3>Comments <span style="color:#999;font-size:14px;">${reelComments.length}</span></h3>
                            <button class="close-btn" onclick="hideComments(${reel.id})">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="comments-list" id="commentsList-${reel.id}">
${reelComments.length > 0 ? reelComments.map(c => createCommentHTML(c, reel.id)).join('') : '<p style="text-align:center;color:#666;font-size:14px;padding:20px;">No comments yet</p>'}
                        </div>
                        <div class="comment-input">
                            <input type="text" placeholder="Add a comment..." id="commentInput-${reel.id}" onkeypress="handleCommentKeyPress(event, ${reel.id})">
                            <button onclick="postComment(${reel.id})">Post</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Create comment HTML with delete button for owner's comments
        function createCommentHTML(comment, reelId) {
            const isOwner = comment.user === CURRENT_USER;
            // Use provided reelId or fall back to comment.reelId
            const actualReelId = reelId || comment.reelId;
            return `
                <div class="comment" data-comment-id="${comment.id}">
                    <div class="comment-avatar">${comment.user.charAt(0).toUpperCase()}</div>
                    <div class="comment-content">
                        <span class="comment-user">@${comment.user}</span>
                        <p class="comment-text">${escapeHtml(comment.text)}</p>
                        <span class="comment-time">${comment.time}</span>
                    </div>
                    ${isOwner ? `<button class="comment-delete-btn" onclick="deleteComment(${actualReelId}, '${comment.id}')" title="Delete comment"><i class="fas fa-trash"></i></button>` : ''}
                </div>
            `;
        }
        
        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ==================== INTERSECTION OBSERVER FOR AUTOPLAY ====================
        function setupIntersectionObserver() {
            const options = {
                root: document.getElementById('reelsContainer'),
                threshold: 0.6 // Video is considered "visible" when 60% is in view
            };
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // Video is visible - play it
                        const video = entry.target;
                        const reelId = parseInt(video.id.replace('video-', ''));
                        const newIndex = parseInt(video.dataset.index);
                        
                        // Only update if the index changed - FIX for comment overlap
                        if (currentReelIndex !== newIndex) {
                            // Close comments when switching to a different reel
                            closeAllComments();
                            currentReelIndex = newIndex;
                            
                            // Update active reel z-index for proper stacking
                            updateActiveReel(newIndex);
                        }
                        
                        playVideo(video);
                        
                        // Update progress bars
                        updateProgressBars();
                    } else {
                        // Video is not visible - pause it
                        pauseVideo(entry.target);
                        // FIX: Close comments when reel goes out of view
                        const videoReelId = parseInt(entry.target.id.replace('video-', ''));
                        if (openCommentsReelId === videoReelId) {
                            closeAllComments();
                        }
                    }
                });
            }, options);
            
            // Observe all videos
            setTimeout(() => {
                document.querySelectorAll('.reel-video').forEach(video => {
                    observer.observe(video);
                });
            }, 100);
        }
        
        // ==================== VIDEO CONTROLS ====================
        function playVideo(video) {
            if (video) {
                const playPromise = video.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        // Play started successfully
                        console.log('Video playing:', video.id);
                    }).catch(error => {
                        // Handle play errors - show fallback image
                        console.log('Video autoplay prevented or failed:', error.message);
                        showFallbackImage(video);
                    });
                }
                video.muted = isMuted;
            }
        }
        
        function playVisibleVideo() {
            // Try to play the first video
            const firstVideo = document.querySelector('.reel-video');
            if (firstVideo) {
                playVideo(firstVideo);
            }
        }
        
        function pauseVideo(video) {
            if (video) {
                video.pause();
            }
        }
        
        function showFallbackImage(video) {
            const slide = video.closest('.reel-item');
            if (slide) {
                const index = parseInt(slide.dataset.index);
                const fallbackImg = fallbackImages[index % fallbackImages.length];
                video.classList.add('fallback');
                video.style.backgroundImage = `url(${fallbackImg})`;
                
                // Hide loading spinner
                const loading = slide.querySelector('.video-loading');
                if (loading) loading.style.display = 'none';
            }
        }
        
        function unmuteVideo(reelId) {
            const video = document.getElementById(`video-${reelId}`);
            if (video) {
                isMuted = false;
                video.muted = false;
                updateMuteIcon();
                
                // Remove overlay
                const overlay = document.querySelector(`[data-id="${reelId}"] .tap-to-unmute`);
                if (overlay) overlay.remove();
                
                // Try to play
                playVideo(video);
            }
        }
        
        function toggleGlobalMute() {
            isMuted = !isMuted;
            updateMuteIcon();
            
            // Update all videos
            document.querySelectorAll('.reel-video').forEach(video => {
                video.muted = isMuted;
            });
            
            // Show/hide tap-to-unmute overlays
            document.querySelectorAll('.reel-item').forEach((item, index) => {
                const reelId = reelsData[index].id;
                const existingOverlay = item.querySelector('.tap-to-unmute');
                
                if (isMuted && !existingOverlay) {
                    const overlay = document.createElement('div');
                    overlay.className = 'tap-to-unmute';
                    overlay.onclick = () => unmuteVideo(reelId);
                    overlay.innerHTML = '<i class="fas fa-volume-mute"></i><span>Tap to unmute</span>';
                    item.appendChild(overlay);
                } else if (!isMuted && existingOverlay) {
                    existingOverlay.remove();
                }
            });
        }
        
        function updateMuteIcon() {
            const icon = document.getElementById('muteIcon');
            icon.className = isMuted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
        }
        
        // ==================== SCROLL DETECTION ====================
        function setupScrollDetection() {
            const container = document.getElementById('reelsContainer');
            let scrollTimeout = null;
            
            container.addEventListener('scroll', () => {
                if (scrollTimeout) return;
                
                scrollTimeout = setTimeout(() => {
                    scrollTimeout = null;
                    handleScroll();
                }, 100);
            }, { passive: true });
            
            // Initial check
            setTimeout(handleScroll, 500);
        }
        
        function handleScroll() {
            const container = document.getElementById('reelsContainer');
            const scrollTop = container.scrollTop;
            const windowHeight = container.clientHeight;
            
            // Find which reel is visible - use scroll position to determine
            const newIndex = Math.round(scrollTop / windowHeight);
            
            if (newIndex !== currentReelIndex && newIndex >= 0 && newIndex < reelsData.length) {
                const previousReelIndex = currentReelIndex;
                currentReelIndex = newIndex;
                
                // FIX: Close comments when scrolling to a different reel
                closeAllComments();
                
                // Pause previous video
                const prevVideo = document.querySelector(`#video-${reelsData[previousReelIndex].id}`);
                if (prevVideo) pauseVideo(prevVideo);
                
                // Play new video after a short delay
                setTimeout(() => {
                    const newVideo = document.querySelector(`#video-${reelsData[currentReelIndex].id}`);
                    if (newVideo) {
                        playVideo(newVideo);
                    }
                }, 100);
                
                // Update progress bars
                updateProgressBars();
            } else if (newIndex === currentReelIndex) {
                // Even if index didn't change, ensure comments are closed
                closeAllComments();
            }
        }
        
        function updateProgressBars() {
            document.querySelectorAll('.progress-bar-item').forEach((item, i) => {
                item.classList.toggle('active', i === currentReelIndex);
            });
        }
        
        // ==================== KEYBOARD NAVIGATION ====================
        function setupKeyboardNavigation() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                    e.preventDefault();
                    if (currentReelIndex < reelsData.length - 1) {
                        currentReelIndex++;
                        scrollToReel(currentReelIndex);
                    }
                } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                    e.preventDefault();
                    if (currentReelIndex > 0) {
                        currentReelIndex--;
                        scrollToReel(currentReelIndex);
                    }
                } else if (e.key === 'm' || e.key === 'M') {
                    toggleGlobalMute();
                }
            });
        }
        
        function scrollToReel(index) {
            isTransitioning = true;
            
            // FIX: Close comments when navigating to a different reel via keyboard
            closeAllComments();
            
            const container = document.getElementById('reelsContainer');
            container.scrollTo({
                top: index * window.innerHeight,
                behavior: 'smooth'
            });
            
            // Play the video
            setTimeout(() => {
                const video = document.querySelector(`#video-${reelsData[index].id}`);
                if (video) playVideo(video);
                isTransitioning = false;
            }, 100);
            
            updateProgressBars();
        }
        
        // ==================== DOUBLE TAP TO LIKE ====================
        let lastTapTime = 0;
        
        function setupDoubleTap() {
            document.getElementById('reelsContainer').addEventListener('click', function(e) {
                // Ignore if clicking on buttons or links
                if (e.target.closest('button') || e.target.closest('a') || e.target.closest('input')) return;
                
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                
                if (tapLength < 300 && tapLength > 0) {
                    // Double tap detected
                    const video = e.target.closest('.reel-item')?.querySelector('.reel-video');
                    if (video) {
                        const reelId = parseInt(video.id.replace('video-', ''));
                        
                        if (!likedPosts.includes(reelId)) {
                            // Show double tap heart
                            const heartEl = document.getElementById(`doubleTapHeart-${reelId}`);
                            if (heartEl) {
                                heartEl.classList.add('show');
                                setTimeout(() => heartEl.classList.remove('show'), 800);
                            }
                            
                            // Toggle like
                            const button = document.querySelector(`[data-id="${reelId}"] .action-btn`);
                            if (button) toggleLike(reelId, button);
                        }
                    }
                    e.preventDefault();
                }
                
                lastTapTime = currentTime;
            });
        }
        
        // ==================== SOCIAL ACTIONS ====================
        function toggleLike(reelId, button) {
            const index = likedPosts.indexOf(reelId);
            const icon = button.querySelector('i');
            const countSpan = button.querySelector('.action-label');
            const reel = reelsData.find(r => r.id === reelId);
            
            if (index > -1) {
                likedPosts.splice(index, 1);
                icon.classList.remove('fas');
                icon.classList.add('far');
                button.classList.remove('liked');
                countSpan.textContent = formatNumber(reel.likes);
            } else {
                likedPosts.push(reelId);
                icon.classList.remove('far');
                icon.classList.add('fas');
                button.classList.add('liked');
                
                // Heart animation
                icon.classList.add('heart-animation');
                setTimeout(() => icon.classList.remove('heart-animation'), 600);
                
                countSpan.textContent = formatNumber(reel.likes + 1);
            }
            
            localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
        }
        
        function toggleFollow(username, button) {
            const index = followedUsers.indexOf(username);
            
            if (index > -1) {
                followedUsers.splice(index, 1);
                button.textContent = 'Follow';
                button.classList.remove('following');
            } else {
                followedUsers.push(username);
                button.textContent = 'Following';
                button.classList.add('following');
            }
            
            localStorage.setItem('followedUsers', JSON.stringify(followedUsers));
        }
        
        // ==================== COMMENTS SYSTEM ====================
        // FIX: Close all open comment panels across all reels
        function closeAllComments() {
            if (openCommentsReelId !== null) {
                const panel = document.getElementById(`comments-${openCommentsReelId}`);
                if (panel) panel.classList.remove('active');
                openCommentsReelId = null;
            }
        }
        
        function showComments(reelId) {
            // First close any open comments on other reels
            closeAllComments();
            
            // Open comments for this reel
            const panel = document.getElementById(`comments-${reelId}`);
            if (panel) {
                panel.classList.add('active');
                openCommentsReelId = reelId;
            }
        }
        
        function hideComments(reelId) {
            const panel = document.getElementById(`comments-${reelId}`);
            if (panel) panel.classList.remove('active');
            if (openCommentsReelId === reelId) {
                openCommentsReelId = null;
            }
        }
        
        function handleCommentKeyPress(e, reelId) {
            if (e.key === 'Enter') postComment(reelId);
        }
        
        function postComment(reelId) {
            const input = document.getElementById(`commentInput-${reelId}`);
            const text = input.value.trim();
            
            if (text) {
                // Ensure comments object has this reel's comments array
                if (!comments[reelId]) {
                    comments[reelId] = [];
                }
                
                // Create comment with unique ID
                const newComment = {
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                    reelId: reelId,
                    user: CURRENT_USER,
                    text: text,
                    time: 'Just now',
                    createdAt: new Date().toISOString()
                };
                
                // Add to local state
                comments[reelId].unshift(newComment);
                localStorage.setItem('reelComments', JSON.stringify(comments));
                
                // Add to UI
                const list = document.getElementById(`commentsList-${reelId}`);
                // Remove "No comments yet" if present
                const noComments = list.querySelector('p');
                if (noComments) noComments.remove();
                
                list.insertAdjacentHTML('afterbegin', createCommentHTML(newComment));
                
                // Update comment count in header
                const header = document.querySelector(`#comments-${reelId} .comments-header h3`);
                if (header) {
                    header.innerHTML = `Comments <span style="color:#999;font-size:14px;">${comments[reelId].length}</span>`;
                }
                
                // Update comment count in action button
                updateCommentCount(reelId);
                
                input.value = '';
            }
        }
        
        function deleteComment(reelId, commentId) {
            // Verify ownership before deletion
            if (!comments[reelId]) {
                console.error('Reel not found');
                return;
            }
            
            const comment = comments[reelId].find(c => c.id === commentId);
            if (!comment) {
                console.error('Comment not found');
                return;
            }
            
            // Check ownership
            if (comment.user !== CURRENT_USER) {
                alert('You can only delete your own comments');
                return;
            }
            
            // Delete from local state
            comments[reelId] = comments[reelId].filter(c => c.id !== commentId);
            localStorage.setItem('reelComments', JSON.stringify(comments));
            
            // Remove from UI
            const commentEl = document.querySelector(`[data-comment-id="${commentId}"]`);
            if (commentEl) {
                commentEl.remove();
            }
            
            // Update comment count in header
            const header = document.querySelector(`#comments-${reelId} .comments-header h3`);
            if (header) {
                header.innerHTML = `Comments <span style="color:#999;font-size:14px;">${comments[reelId].length}</span>`;
            }
            
            // Update comment count in action button
            updateCommentCount(reelId);
            
            // Show "No comments yet" if empty
            const list = document.getElementById(`commentsList-${reelId}`);
            if (comments[reelId].length === 0) {
                list.innerHTML = '<p style="text-align:center;color:#666;font-size:14px;padding:20px;">No comments yet</p>';
            }
        }
        
        function updateCommentCount(reelId) {
            const reel = reelsData.find(r => r.id === reelId);
            const reelComments = comments[reelId] || [];
            const actionButton = document.querySelector(`[data-id="${reelId}"] .action-btn:nth-child(2) .action-label`);
            if (actionButton && reel) {
                actionButton.textContent = formatNumber(reel.comments + reelComments.length);
            }
        }
        
        // ==================== SHARE ====================
        function openShareModal(reelId, brand, price) {
            currentShareProduct = { id: reelId, brand, price };
            document.getElementById('shareLink').value = window.location.href;
            document.getElementById('shareModal').classList.add('active');
        }
        
        function closeShareModal(e) {
            if (!e || e.target === document.getElementById('shareModal')) {
                document.getElementById('shareModal').classList.remove('active');
                currentShareProduct = null;
            }
        }
        
        function shareToWhatsApp() {
            if (currentShareProduct) {
                const text = `Check out this ${currentShareProduct.brand} product for ${currentShareProduct.price} at SOPERA!`;
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            }
            closeShareModal();
        }
        
        function shareToFacebook() {
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, '_blank');
            closeShareModal();
        }
        
        function shareToTwitter() {
            if (currentShareProduct) {
                const text = `Check out this ${currentShareProduct.brand} product for ${currentShareProduct.price} at SOPERA!`;
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
            }
            closeShareModal();
        }
        
        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link copied to clipboard!');
            closeShareModal();
        }
        
        // ==================== CART ====================
        function updateCartCount() {
            document.getElementById('cartCount').textContent = cart.length;
        }
        
        // ==================== UTILITIES ====================
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }
        
        function goBack() {
            window.location.href = 'index.html';
        }
        
        // Video progress tracking
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(() => {
                const video = document.querySelector(`#video-${reelsData[currentReelIndex]?.id}`);
                if (video && video.duration) {
                    const progress = (video.currentTime / video.duration) * 100;
                    const progressFill = document.getElementById(`progress-${reelsData[currentReelIndex]?.id}-${currentReelIndex}`);
                    if (progressFill) {
                        progressFill.style.width = progress + '%';
                    }
                }
            }, 200);
        });
    </script>
</body>
</html>
