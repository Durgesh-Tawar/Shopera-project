<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - SOPERA</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #282c3f;
            font-size: 24px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #282c3f;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4d5d9;
            border-radius: 4px;
            font-size: 14px;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #ff3f6c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background: #ff527b;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #696e79;
        }
        .footer-text a {
            color: #ff3f6c;
            text-decoration: none;
            font-weight: 600;
        }
        .error-message {
            color: #ff3f6c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Signup</h2>
        </div>
        <form id="signupForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Create a password">
                <div id="signupError" class="error-message"></div>
            </div>
            <button type="submit" class="login-btn">CONTINUE</button>
        </form>
        <div class="footer-text">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('signupError');

            try {
                const response = await fetch('http://localhost:5000/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert('Signup Successful!');
                    console.log('User Data:', data.user);
                    window.location.href = 'login.html';
                } else {
                    // DISPLAY THE ACTUAL ERROR FROM THE BACKEND
                    const errorMessage = data.debug_info || data.message || 'Error creating account';
                    errorDiv.textContent = '❌ ERROR: ' + errorMessage;
                    errorDiv.style.display = 'block';
                    console.error('Backend Error:', data);
                }
            } catch (error) {
                errorDiv.textContent = '❌ Connection Error: Is the server running on port 5000?';
                errorDiv.style.display = 'block';
                console.error('Fetch Error:', error);
            }
        });
    </script>
</body>
</html>
