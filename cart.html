<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPERA - Cart</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="logo">SOPERA</div>
    <div class="nav-search">
        <input type="text" placeholder="Search products...">
    </div>
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <!-- Mobile Overlay -->
    <div class="nav-overlay" id="navOverlay"></div>
    <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="mood.html">Mood</a></li>
        <li><a href="reels.html">Reels</a></li>
        <li><a href="spin.html">Spin & Win 🎁</a></li>
        <li><a href="cart.html">Cart 🛒</a></li>
        <li><a href="wishlist.html">Wishlist ❤️</a></li>
        <li><a href="orders.html">Orders 📦</a></li>
        <li><a href="profile.html">Profile 👤</a></li>
    </ul>
</nav>

<section class="cart-section">
    <h1>Your Cart</h1>
    <div id="cartItems"></div>

    <div class="price-summary">
        <p>Subtotal: ₹<span id="subtotal"></span></p>
        <p>Discount: <span id="discountText"></span></p>
        <p>Total Payable: ₹<span id="finalTotal"></span></p>
        <p>Loyalty Points: <span id="loyaltyPoints"></span></p>
    </div>

    <button id="placeOrderBtn">Place Order</button>
</section>

<script src="js/cart.js"></script>
<script>
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');
    const navOverlay = document.getElementById('navOverlay');
    
    hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('active');
        navLinks.classList.toggle('active');
        navOverlay.classList.toggle('active');
    });

    // Close menu when clicking on overlay
    if (navOverlay) {
        navOverlay.addEventListener('click', () => {
            hamburger.classList.remove('active');
            navLinks.classList.remove('active');
            navOverlay.classList.remove('active');
        });
    }

    // Close menu when clicking on a nav link
    navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            hamburger.classList.remove('active');
            navLinks.classList.remove('active');
            navOverlay.classList.remove('active');
        });
    });
</script>
</body>
</html>
