<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SOPERA</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #f9f9fb;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .reset-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .reset-header {
            margin-bottom: 30px;
        }
        .reset-header h2 {
            color: #282c3f;
            margin-bottom: 10px;
        }
        .reset-header p {
            color: #696e79;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #282c3f;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4d5d9;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #ff3f6c;
        }
        .reset-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #ff3f6c, #ff6b9d);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 63, 108, 0.3);
        }
        .message-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }
        .error {
            background-color: #ffe0e6;
            color: #ff3f6c;
        }
        .success {
            background-color: #e6f9ed;
            color: #03a65a;
        }
        .back-link {
            margin-top: 20px;
            display: inline-block;
            font-size: 0.9rem;
            color: #ff3f6c;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="reset-container">
        <div class="reset-header">
            <h2>Reset Password</h2>
            <p>Enter your new password below.</p>
        </div>

        <form id="resetForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" required placeholder="Minimum 8 characters">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required placeholder="Re-enter password">
            </div>

            <div id="messageBox" class="message-box"></div>

            <button type="submit" class="reset-btn" id="submitBtn">Update Password</button>
        </form>

        <a href="login.html" class="back-link">← Back to Login</a>
    </div>

    <script src="js/config.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageBox = document.getElementById('messageBox');
            const submitBtn = document.getElementById('submitBtn');

            // Reset message box
            messageBox.style.display = 'none';
            messageBox.className = 'message-box';

            if (password !== confirmPassword) {
                messageBox.textContent = 'Passwords do not match!';
                messageBox.classList.add('error');
                messageBox.style.display = 'block';
                return;
            }

            if (password.length < 8) {
                messageBox.textContent = 'Password must be at least 8 characters.';
                messageBox.classList.add('error');
                messageBox.style.display = 'block';
                return;
            }

            // Extract the token parameter from URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                messageBox.textContent = 'Invalid or missing reset token in URL.';
                messageBox.classList.add('error');
                messageBox.style.display = 'block';
                return;
            }

            submitBtn.textContent = 'Updating...';
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (data.success) {
                    messageBox.textContent = 'Password updated successfully! Redirecting...';
                    messageBox.classList.add('success');
                    messageBox.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    messageBox.textContent = data.message || 'Error resetting password.';
                    messageBox.classList.add('error');
                    messageBox.style.display = 'block';
                    submitBtn.textContent = 'Update Password';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                messageBox.textContent = 'Server connection error. Please try again.';
                messageBox.classList.add('error');
                messageBox.style.display = 'block';
                submitBtn.textContent = 'Update Password';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
