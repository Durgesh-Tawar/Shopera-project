<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPERA - Reels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Scrollbar Hide */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Snap Scrolling */
        .reels-container {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            height: 100vh;
            overflow-y: scroll;
        }
        
        .reel-item {
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }
        
        /* Video Styles */
        .reel-video {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
        
        /* Progress Bar */
        .progress-bar-container {
            position: absolute;
            bottom: 80px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
            z-index: 20;
        }
        
        .progress-bar-item {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .progress-bar-item.active .progress-bar-fill {
            background: #ff3f6c;
        }
        
        /* Heart Animation */
        @keyframes heartBeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1); }
            75% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        .heart-animation {
            animation: heartBeat 0.6s ease-in-out;
        }
        
        @keyframes doubleTapHeart {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
        
        .double-tap-heart {
            animation: doubleTapHeart 1s ease-out forwards;
        }
        
        /* Spin Animation for Music Disc */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .disc-spin {
            animation: spin 3s linear infinite;
        }
        
        /* Mute Overlay */
        .tap-to-unmute {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.6);
            padding: 20px 30px;
            border-radius: 30px;
            color: white;
            z-index: 30;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        
        .tap-to-unmute:hover {
            background: rgba(0,0,0,0.8);
        }
        
        /* Comments Panel */
        .comments-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            max-height: 60vh;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 40;
            border-radius: 20px 20px 0 0;
        }
        
        .comments-panel.active {
            transform: translateY(0);
        }
        
        /* Share Modal */
        .share-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 50;
            padding-bottom: 20px;
        }
        
        .share-modal.active {
            display: flex;
        }
        
        .share-content {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        /* Follow Button */
        .follow-btn {
            background: #ff3f6c;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .follow-btn:hover {
            background: #ff6b9d;
        }
        
        .follow-btn.following {
            background: transparent;
            border: 1px solid white;
        }
        
        /* Loading Spinner */
        .video-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #ff3f6c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 5;
        }
        
        /* Back Button */
        .back-btn {
            position: absolute;
            top: 40px;
            left: 15px;
            z-index: 25;
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
    </style>
</head>
<body class="bg-black">
    
    <!-- Reels Container -->
    <div class="reels-container no-scrollbar" id="reelsContainer">
        <!-- Reels will be dynamically generated -->
    </div>
    
    <!-- Back Button -->
    <button class="back-btn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i>
    </button>
    
    <!-- Global Mute Button -->
    <button id="globalMuteBtn" class="fixed top-4 right-4 z-50 bg-black/50 hover:bg-black/70 text-white w-12 h-12 rounded-full flex items-center justify-center transition-all" onclick="toggleGlobalMute()">
        <i class="fas fa-volume-up" id="muteIcon"></i>
    </button>

    <!-- Share Modal -->
    <div class="share-modal" id="shareModal" onclick="closeShareModal(event)">
        <div class="share-content" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold">Share</h3>
                <button onclick="closeShareModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="flex justify-around py-4">
                <button onclick="shareToWhatsApp()" class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 bg-green-500 rounded-full flex items-center justify-center text-white text-2xl">
                        <i class="fab fa-whatsapp"></i>
                    </div>
                    <span class="text-xs text-gray-600">WhatsApp</span>
                </button>
                <button onclick="shareToFacebook()" class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center text-white text-2xl">
                        <i class="fab fa-facebook-f"></i>
                    </div>
                    <span class="text-xs text-gray-600">Facebook</span>
                </button>
                <button onclick="shareToTwitter()" class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 bg-black rounded-full flex items-center justify-center text-white text-2xl border">
                        <i class="fab fa-x-twitter"></i>
                    </div>
                    <span class="text-xs text-gray-600">Twitter</span>
                </button>
                <button onclick="copyLink()" class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 bg-gray-500 rounded-full flex items-center justify-center text-white text-2xl">
                        <i class="fas fa-link"></i>
                    </div>
                    <span class="text-xs text-gray-600">Copy</span>
                </button>
            </div>
            <div class="border-t pt-4">
                <input type="text" id="shareLink" class="w-full bg-gray-100 px-4 py-2 rounded-lg text-sm" readonly>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        // Add your videos here - just add more objects to this array
        const reelsData = [
            {
                id: 1,
                video: "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-1232-large.mp4",
                image: "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800",
                brand: "SOPERA",
                username: "@sopera_fashion",
                description: "New collection is here! ✨ Shop the latest trends #SOPERA #Fashion #NewArrival #Style",
                hashtags: ["SOPERA", "Fashion", "NewArrival", "Style"],
                productLink: "product.html?id=1",
                price: "₹1,299",
                likes: 12400,
                comments: 234,
                shares: 56
            },
            {
                id: 2,
                video: "https://assets.mixkit.co/videos/preview/mixkit-fashion-model-posing-in-purple-39864-large.mp4",
                image: "https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800",
                brand: "SOPERA",
                username: "@sopera_style",
                description: "Elegant purple vibes 💜 Perfect for parties! #SOPERA #PartyWear #PurpleDress",
                hashtags: ["SOPERA", "PartyWear", "PurpleDress", "Elegant"],
                productLink: "product.html?id=2",
                price: "₹2,499",
                likes: 8900,
                comments: 156,
                shares: 34
            },
            {
                id: 3,
                video: "https://assets.mixkit.co/videos/preview/mixkit-woman-shopping-in-a-store-4773-large.mp4",
                image: "https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=800",
                brand: "SOPERA",
                username: "@sopera_trends",
                description: "Weekend shopping vibes 🛍️ Grab your favorites! #SOPERA #WeekendVibes #Shopping",
                hashtags: ["SOPERA", "WeekendVibes", "Shopping", "Fashion"],
                productLink: "product.html?id=3",
                price: "₹899",
                likes: 15600,
                comments: 312,
                shares: 89
            },
            {
                id: 4,
                video: "https://assets.mixkit.co/videos/preview/mixkit-young-woman-in-a-casual-outfit-posing-39643-large.mp4",
                image: "https://images.unsplash.com/photo-1445205170230-053b83016050?w=800",
                brand: "SOPERA",
                username: "@sopera_casual",
                description: "Casual chic for everyday 👖 Comfort meets style! #SOPERA #CasualWear #StreetStyle",
                hashtags: ["SOPERA", "CasualWear", "StreetStyle", "Comfort"],
                productLink: "product.html?id=4",
                price: "₹1,599",
                likes: 22300,
                comments: 445,
                shares: 120
            },
            {
                id: 5,
                video: "https://assets.mixkit.co/videos/preview/mixkit-model-posing-with-a-purple-dress-39865-large.mp4",
                image: "https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=800",
                brand: "SOPERA",
                username: "@sopera_elegant",
                description: "Red carpet ready 💃 Statement pieces for special occasions! #SOPERA #Elegant #Designer",
                hashtags: ["SOPERA", "Elegant", "Designer", "Luxury"],
                productLink: "product.html?id=5",
                price: "₹4,999",
                likes: 31200,
                comments: 678,
                shares: 234
            }
        ];
        
        // ==================== STATE ====================
        let currentReelIndex = 0;
        let isMuted = false;
        let likedPosts = JSON.parse(localStorage.getItem('likedPosts')) || [];
        let followedUsers = JSON.parse(localStorage.getItem('followedUsers')) || [];
        let comments = JSON.parse(localStorage.getItem('reelComments')) || {};
        let currentShareProduct = null;
        
        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', () => {
            renderReels();
            setupScrollDetection();
            setupKeyboardNavigation();
        });
        
        // ==================== RENDER FUNCTIONS ====================
        function renderReels() {
            const container = document.getElementById('reelsContainer');
            container.innerHTML = reelsData.map((reel, index) => createReelHTML(reel, index)).join('');
            
            // Initialize first video
            setTimeout(() => {
                const firstVideo = document.querySelector('.reel-video');
                if (firstVideo) playVideo(firstVideo);
            }, 500);
        }
        
        function createReelHTML(reel, index) {
            const isLiked = likedPosts.includes(reel.id);
            const isFollowing = followedUsers.includes(reel.username.replace('@', ''));
            const reelComments = comments[reel.id] || [];
            
            return `
                <div class="reel-item relative h-screen w-full bg-black" data-index="${index}" data-id="${reel.id}">
                    <!-- Video Loading -->
                    <div class="video-loading"></div>
                    
                    <!-- Video -->
                    <video 
                        class="reel-video" 
                        id="video-${reel.id}"
                        src="${reel.video}"
                        poster="${reel.image}"
                        loop
                        playsinline
                        preload="metadata"
                        muted="${isMuted}"
                        data-index="${index}"
                    ></video>
                    
                    <!-- Double Tap Heart -->
                    <div class="double-tap-heart hidden" id="doubleTapHeart-${reel.id}">
                        <i class="fas fa-heart text-white text-8xl"></i>
                    </div>
                    
                    <!-- Mute Overlay (shown when muted) -->
                    ${isMuted ? `
                        <div class="tap-to-unmute" onclick="unmuteVideo(${reel.id})">
                            <i class="fas fa-volume-mute text-xl"></i>
                            <span>Tap to unmute</span>
                        </div>
                    ` : ''}
                    
                    <!-- Progress Bars -->
                    <div class="progress-bar-container">
                        ${reelsData.map((_, i) => `
                            <div class="progress-bar-item ${i === index ? 'active' : ''}" data-progress="${i}">
                                <div class="progress-bar-fill" id="progress-${reel.id}-${i}"></div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <!-- Left Side - Product Info -->
                    <div class="absolute bottom-20 left-4 right-20 z-20 text-white">
                        <!-- User Info -->
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center font-bold">
                                ${reel.username.charAt(1).toUpperCase()}
                            </div>
                            <span class="font-semibold text-sm">${reel.username}</span>
                            <button class="follow-btn ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${reel.username.replace('@', '')}', this)">
                                ${isFollowing ? 'Following' : 'Follow'}
                            </button>
                        </div>
                        
                        <!-- Description -->
                        <p class="text-sm mb-2">${reel.description}</p>
                        
                        <!-- Hashtags -->
                        <div class="flex flex-wrap gap-2 mb-3">
                            ${reel.hashtags.map(tag => `
                                <span class="text-xs text-white/70">#${tag}</span>
                            `).join('')}
                        </div>
                        
                        <!-- Shop Now Button -->
                        <a href="${reel.productLink}" class="inline-flex items-center gap-2 bg-white text-black px-4 py-2 rounded-full text-sm font-semibold hover:bg-gray-200 transition">
                            <span>Shop Now</span>
                            <span class="text-pink-500 font-bold">${reel.price}</span>
                            <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                    
                    <!-- Right Side - Actions -->
                    <div class="absolute bottom-20 right-4 z-20 flex flex-col items-center gap-5">
                        <!-- Like -->
                        <button class="flex flex-col items-center gap-1" onclick="toggleLike(${reel.id}, this)">
                            <div class="w-12 h-12 rounded-full bg-black/30 flex items-center justify-center text-2xl transition-all ${isLiked ? 'text-pink-500' : 'text-white'}">
                                <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>
                            </div>
                            <span class="text-xs text-white">${formatNumber(reel.likes + (isLiked ? 1 : 0))}</span>
                        </button>
                        
                        <!-- Comment -->
                        <button class="flex flex-col items-center gap-1" onclick="showComments(${reel.id})">
                            <div class="w-12 h-12 rounded-full bg-black/30 flex items-center justify-center text-2xl text-white">
                                <i class="far fa-comment"></i>
                            </div>
                            <span class="text-xs text-white">${formatNumber(reel.comments + reelComments.length)}</span>
                        </button>
                        
                        <!-- Share -->
                        <button class="flex flex-col items-center gap-1" onclick="openShareModal(${reel.id}, '${reel.brand}', '${reel.price}')">
                            <div class="w-12 h-12 rounded-full bg-black/30 flex items-center justify-center text-2xl text-white">
                                <i class="fas fa-paper-plane"></i>
                            </div>
                            <span class="text-xs text-white">${formatNumber(reel.shares)}</span>
                        </button>
                        
                        <!-- Music Disc -->
                        <div class="w-12 h-12 rounded-full bg-black/30 flex items-center justify-center mt-2">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center disc-spin">
                                <i class="fas fa-music text-white text-sm"></i>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Comments Panel -->
                    <div class="comments-panel" id="comments-${reel.id}">
                        <div class="flex justify-between items-center p-4 border-b border-gray-700">
                            <h3 class="font-semibold">Comments <span class="text-gray-400 text-sm">${reelComments.length}</span></h3>
                            <button onclick="hideComments(${reel.id})" class="text-gray-400 hover:text-white">
                                <i class="fas fa-times text-xl"></i>
                            </button>
                        </div>
                        <div class="overflow-y-auto h-64 p-4 space-y-4" id="commentsList-${reel.id}">
                            ${reelComments.length > 0 ? reelComments.map(c => `
                                <div class="flex gap-3">
                                    <div class="w-8 h-8 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center text-xs font-bold flex-shrink-0">
                                        ${c.user.charAt(0).toUpperCase()}
                                    </div>
                                    <div>
                                        <span class="font-semibold text-sm">@${c.user}</span>
                                        <p class="text-sm text-gray-300">${c.text}</p>
                                        <span class="text-xs text-gray-500">${c.time}</span>
                                    </div>
                                </div>
                            `).join('') : '<p class="text-center text-gray-500 text-sm">No comments yet</p>'}
                        </div>
                        <div class="p-4 border-t border-gray-700">
                            <div class="flex gap-2">
                                <input type="text" placeholder="Add a comment..." 
                                    class="flex-1 bg-gray-800 text-white px-4 py-2 rounded-full text-sm"
                                    id="commentInput-${reel.id}"
                                    onkeypress="handleCommentKeyPress(event, ${reel.id})">
                                <button onclick="postComment(${reel.id})" class="bg-pink-500 text-white px-4 py-2 rounded-full text-sm font-semibold">
                                    Post
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // ==================== VIDEO CONTROLS ====================
        function playVideo(video) {
            if (video) {
                video.play().catch(e => console.log('Play error:', e));
                video.muted = isMuted;
            }
        }
        
        function pauseVideo(video) {
            if (video) video.pause();
        }
        
        function unmuteVideo(reelId) {
            const video = document.getElementById(`video-${reelId}`);
            if (video) {
                isMuted = false;
                video.muted = false;
                updateMuteIcon();
                
                // Remove overlay
                const overlay = document.querySelector(`[data-id="${reelId}"] .tap-to-unmute`);
                if (overlay) overlay.remove();
            }
        }
        
        function toggleGlobalMute() {
            isMuted = !isMuted;
            updateMuteIcon();
            
            // Update all videos
            document.querySelectorAll('.reel-video').forEach(video => {
                video.muted = isMuted;
            });
            
            // Show/hide tap-to-unmute overlays
            document.querySelectorAll('.reel-item').forEach((item, index) => {
                const reelId = reelsData[index].id;
                const existingOverlay = item.querySelector('.tap-to-unmute');
                
                if (isMuted && !existingOverlay) {
                    const overlay = document.createElement('div');
                    overlay.className = 'tap-to-unmute';
                    overlay.onclick = () => unmuteVideo(reelId);
                    overlay.innerHTML = '<i class="fas fa-volume-mute text-xl"></i><span>Tap to unmute</span>';
                    item.appendChild(overlay);
                } else if (!isMuted && existingOverlay) {
                    existingOverlay.remove();
                }
            });
        }
        
        function updateMuteIcon() {
            const icon = document.getElementById('muteIcon');
            icon.className = isMuted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
        }
        
        // ==================== SCROLL DETECTION ====================
        function setupScrollDetection() {
            const container = document.getElementById('reelsContainer');
            let scrollTimeout = null;
            
            container.addEventListener('scroll', () => {
                if (scrollTimeout) return;
                scrollTimeout = setTimeout(() => {
                    scrollTimeout = null;
                    handleScroll();
                }, 100);
            }, { passive: true });
            
            // Initial check
            handleScroll();
        }
        
        function handleScroll() {
            const container = document.getElementById('reelsContainer');
            const scrollTop = container.scrollTop;
            const windowHeight = window.innerHeight;
            
            // Find which reel is visible
            const newIndex = Math.round(scrollTop / windowHeight);
            
            if (newIndex !== currentReelIndex && newIndex >= 0 && newIndex < reelsData.length) {
                // Pause previous video
                const prevVideo = document.querySelector(`#video-${reelsData[currentReelIndex].id}`);
                if (prevVideo) pauseVideo(prevVideo);
                
                currentReelIndex = newIndex;
                
                // Play new video
                const newVideo = document.querySelector(`#video-${reelsData[currentReelIndex].id}`);
                if (newVideo) playVideo(newVideo);
                
                // Update progress bars
                updateProgressBars();
            }
        }
        
        function updateProgressBars() {
            document.querySelectorAll('.progress-bar-item').forEach((item, i) => {
                item.classList.toggle('active', i === currentReelIndex);
            });
        }
        
        // ==================== KEYBOARD NAVIGATION ====================
        function setupKeyboardNavigation() {
            document.addEventListener('keydown', (e) => {
                const container = document.getElementById('reelsContainer');
                
                if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                    e.preventDefault();
                    if (currentReelIndex < reelsData.length - 1) {
                        currentReelIndex++;
                        scrollToReel(currentReelIndex);
                    }
                } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                    e.preventDefault();
                    if (currentReelIndex > 0) {
                        currentReelIndex--;
                        scrollToReel(currentReelIndex);
                    }
                } else if (e.key === 'm' || e.key === 'M') {
                    toggleGlobalMute();
                }
            });
        }
        
        function scrollToReel(index) {
            const container = document.getElementById('reelsContainer');
            container.scrollTo({
                top: index * window.innerHeight,
                behavior: 'smooth'
            });
            
            // Play the video
            const video = document.querySelector(`#video-${reelsData[index].id}`);
            if (video) playVideo(video);
            
            updateProgressBars();
        }
        
        // ==================== SOCIAL ACTIONS ====================
        function toggleLike(reelId, button) {
            const index = likedPosts.indexOf(reelId);
            const icon = button.querySelector('i');
            const countSpan = button.querySelector('span');
            const reel = reelsData.find(r => r.id === reelId);
            
            if (index > -1) {
                likedPosts.splice(index, 1);
                icon.classList.remove('fas');
                icon.classList.add('far');
                icon.classList.remove('text-pink-500');
                countSpan.textContent = formatNumber(reel.likes);
            } else {
                likedPosts.push(reelId);
                icon.classList.remove('far');
                icon.classList.add('fas');
                icon.classList.add('text-pink-500');
                
                // Heart animation
                icon.classList.add('heart-animation');
                setTimeout(() => icon.classList.remove('heart-animation'), 600);
                
                countSpan.textContent = formatNumber(reel.likes + 1);
            }
            
            localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
        }
        
        // Double tap to like
        document.addEventListener('click', (e) => {
            if (e.detail === 2) {
                const video = e.target.closest('.reel-video');
                if (video) {
                    const reelId = parseInt(video.id.replace('video-', ''));
                    const button = document.querySelector(`[data-id="${reelId}"] .fa-heart`).closest('button');
                    
                    if (!likedPosts.includes(reelId)) {
                        // Show double tap heart
                        const heartEl = document.getElementById(`doubleTapHeart-${reelId}`);
                        if (heartEl) {
                            heartEl.classList.remove('hidden');
                            heartEl.classList.add('double-tap-heart');
                            setTimeout(() => {
                                heartEl.classList.add('hidden');
                                heartEl.classList.remove('double-tap-heart');
                            }, 1000);
                        }
                        
                        // Toggle like
                        if (button) toggleLike(reelId, button);
                    }
                }
            }
        });
        
        function toggleFollow(username, button) {
            const index = followedUsers.indexOf(username);
            
            if (index > -1) {
                followedUsers.splice(index, 1);
                button.textContent = 'Follow';
                button.classList.remove('following');
            } else {
                followedUsers.push(username);
                button.textContent = 'Following';
                button.classList.add('following');
            }
            
            localStorage.setItem('followedUsers', JSON.stringify(followedUsers));
        }
        
        // ==================== COMMENTS ====================
        function showComments(reelId) {
            const panel = document.getElementById(`comments-${reelId}`);
            if (panel) panel.classList.add('active');
        }
        
        function hideComments(reelId) {
            const panel = document.getElementById(`comments-${reelId}`);
            if (panel) panel.classList.remove('active');
        }
        
        function handleCommentKeyPress(e, reelId) {
            if (e.key === 'Enter') postComment(reelId);
        }
        
        function postComment(reelId) {
            const input = document.getElementById(`commentInput-${reelId}`);
            const text = input.value.trim();
            
            if (text) {
                if (!comments[reelId]) comments[reelId] = [];
                
                const newComment = {
                    user: 'you',
                    text: text,
                    time: 'Just now'
                };
                
                comments[reelId].unshift(newComment);
                localStorage.setItem('reelComments', JSON.stringify(comments));
                
                // Add to UI
                const list = document.getElementById(`commentsList-${reelId}`);
                const html = `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center text-xs font-bold flex-shrink-0">
                            Y
                        </div>
                        <div>
                            <span class="font-semibold text-sm">@you</span>
                            <p class="text-sm text-gray-300">${text}</p>
                            <span class="text-xs text-gray-500">Just now</span>
                        </div>
                    </div>
                `;
                list.insertAdjacentHTML('afterbegin', html);
                
                input.value = '';
            }
        }
        
        // ==================== SHARE ====================
        function openShareModal(reelId, brand, price) {
            currentShareProduct = { id: reelId, brand, price };
            document.getElementById('shareLink').value = window.location.href;
            document.getElementById('shareModal').classList.add('active');
        }
        
        function closeShareModal(e) {
            if (!e || e.target === document.getElementById('shareModal')) {
                document.getElementById('shareModal').classList.remove('active');
                currentShareProduct = null;
            }
        }
        
        function shareToWhatsApp() {
            if (currentShareProduct) {
                const text = `Check out this ${currentShareProduct.brand} product for ${currentShareProduct.price} at SOPERA!`;
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            }
            closeShareModal();
        }
        
        function shareToFacebook() {
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, '_blank');
            closeShareModal();
        }
        
        function shareToTwitter() {
            if (currentShareProduct) {
                const text = `Check out this ${currentShareProduct.brand} product for ${currentShareProduct.price} at SOPERA!`;
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
            }
            closeShareModal();
        }
        
        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link copied to clipboard!');
            closeShareModal();
        }
        
        // ==================== UTILITIES ====================
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }
        
        function goBack() {
            window.location.href = 'index.html';
        }
        
        // Video progress tracking
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(() => {
                const video = document.querySelector(`#video-${reelsData[currentReelIndex]?.id}`);
                if (video && video.duration) {
                    const progress = (video.currentTime / video.duration) * 100;
                    const progressFill = document.getElementById(`progress-${reelsData[currentReelIndex]?.id}-${currentReelIndex}`);
                    if (progressFill) {
                        progressFill.style.width = progress + '%';
                    }
                }
            }, 100);
        });
    </script>
</body>
</html>
