<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOPERA - Mood Shop</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="logo">SOPERA</div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="mood.html">Mood</a></li>
        <li><a href="reels.html">Reels</a></li>
        <li><a href="spin.html">Spin & Win 🎁</a></li>
        <li><a href="cart.html">Cart 🛒</a></li>
        <li><a href="orders.html">Orders 📦</a></li>
    </ul>
</nav>

<section class="products">
    <h2>Mood-based Picks</h2>

    <label for="moodSelect">Select Mood: </label>
    <select id="moodSelect">
        <option value="all">All</option>
        <option value="casual">Casual</option>
        <option value="party">Party</option>
        <option value="formal">Formal</option>
    </select>

    <div class="product-grid" id="moodGrid"></div>
</section>

<script src="js/data.js"></script>
<script>
const moodGrid = document.getElementById("moodGrid");
const moodSelect = document.getElementById("moodSelect");
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderMoodProducts(filter){
    moodGrid.innerHTML = "";
    let filtered = (filter==="all") ? products : products.filter(p=>p.mood===filter);
    filtered.forEach(p=>{
        const div = document.createElement("div");
        div.classList.add("product-card");
        div.innerHTML = `<img src="${p.image}" alt="${p.name}">
                         <h3>${p.name}</h3>
                         <p>₹${p.price}</p>
                         <button onclick="addToCart(${p.id})">Add to Cart</button>`;
        moodGrid.appendChild(div);
    });
}

moodSelect.addEventListener("change", ()=> renderMoodProducts(moodSelect.value));
renderMoodProducts("all");

function addToCart(id){
    const product = products.find(p=>p.id===id);
    cart.push(product);
    localStorage.setItem("cart", JSON.stringify(cart));
    alert(`${product.name} added to cart!`);
}
</script>
</body>
</html>
