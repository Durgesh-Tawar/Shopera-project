<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOPERA - AI Virtual Try-On</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* Virtual Try-On Page Styles */
.tryon-container {
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
}

.tryon-header {
    text-align: center;
    margin-bottom: 40px;
}

.tryon-header h1 {
    font-size: 2.5rem;
    color: #1a1a2e;
    margin-bottom: 10px;
    background: linear-gradient(45deg, #ff3f6c, #ff6b9d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.tryon-header p {
    color: #666;
    font-size: 1.1rem;
}

/* Main Try-On Layout */
.tryon-main {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 30px;
    min-height: 600px;
}

/* T-Shirt Selection Panel */
.tshirt-panel {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    height: fit-content;
    position: sticky;
    top: 100px;
}

.tshirt-panel h2 {
    font-size: 1.3rem;
    color: #1a1a2e;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.tshirt-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.tshirt-option {
    border: 3px solid #eee;
    border-radius: 15px;
    padding: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: center;
}

.tshirt-option:hover {
    border-color: #ff6b9d;
    transform: translateY(-3px);
}

.tshirt-option.selected {
    border-color: #ff3f6c;
    background: linear-gradient(135deg, rgba(255,63,108,0.1) 0%, rgba(255,107,157,0.1) 100%);
}

.tshirt-option img {
    width: 100%;
    height: 100px;
    object-fit: contain;
    border-radius: 10px;
}

.tshirt-option span {
    display: block;
    margin-top: 8px;
    font-size: 0.85rem;
    color: #666;
    font-weight: 500;
}

/* Try-On Stage */
.tryon-stage {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    position: relative;
    overflow: hidden;
    min-height: 500px;
    display: flex;
    flex-direction: column;
}

/* Upload Section */
.upload-section {
    border: 3px dashed #ddd;
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    transition: all 0.3s ease;
    cursor: pointer;
    margin-bottom: 20px;
}

.upload-section:hover, .upload-section.dragover {
    border-color: #ff3f6c;
    background: rgba(255,63,108,0.05);
}

.upload-section input[type="file"] {
    display: none;
}

.upload-icon {
    font-size: 60px;
    margin-bottom: 15px;
}

.upload-section h3 {
    color: #1a1a2e;
    margin-bottom: 10px;
}

.upload-section p {
    color: #888;
    font-size: 0.9rem;
}

/* Preview Area */
.preview-area {
    position: relative;
    flex: 1;
    min-height: 400px;
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    border-radius: 15px;
    overflow: hidden;
    display: none;
}

.preview-area.active {
    display: block;
}

.preview-area img.user-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: absolute;
    top: 0;
    left: 0;
}

/* T-Shirt Overlay */
.tshirt-overlay {
    position: absolute;
    left: 50%;
    top: 15%;
    transform: translateX(-50%);
    width: 40%;
    height: auto;
    max-height: 70%;
    object-fit: contain;
    transition: all 0.3s ease;
    filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
}

/* Controls */
.controls-section {
    margin-top: 20px;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 15px;
    display: none;
}

.controls-section.active {
    display: block;
}

.control-group {
    margin-bottom: 20px;
}

.control-group label {
    display: block;
    font-weight: 600;
    color: #333;
    margin-bottom: 10px;
    font-size: 0.9rem;
}

.control-group input[type="range"] {
    width: 100%;
    height: 8px;
    border-radius: 5px;
    background: #ddd;
    outline: none;
    -webkit-appearance: none;
}

.control-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(45deg, #ff3f6c, #ff6b9d);
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(255,63,108,0.4);
}

.control-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.control-row .control-group {
    flex: 1;
    min-width: 150px;
}

/* Action Buttons */
.action-buttons {
    display: flex;
    gap: 15px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.action-btn {
    padding: 14px 30px;
    border: none;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.tryon-btn {
    background: linear-gradient(45deg, #ff3f6c, #ff6b9d);
    color: white;
    box-shadow: 0 5px 20px rgba(255,63,108,0.4);
}

.tryon-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(255,63,108,0.5);
}

.reset-btn {
    background: #f0f0f5;
    color: #333;
}

.reset-btn:hover {
    background: #e0e0e5;
}

.download-btn {
    background: linear-gradient(45deg, #28a745, #20c997);
    color: white;
}

.download-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(40,167,69,0.4);
}

/* Demo Tips */
.demo-tips {
    margin-top: 30px;
    padding: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 15px;
    color: white;
}

.demo-tips h3 {
    margin-bottom: 15px;
    font-size: 1.1rem;
}

.demo-tips ul {
    list-style: none;
    padding: 0;
}

.demo-tips li {
    margin-bottom: 10px;
    padding-left: 25px;
    position: relative;
    font-size: 0.95rem;
}

.demo-tips li::before {
    content: '✨';
    position: absolute;
    left: 0;
}

/* Responsive */
@media (max-width: 992px) {
    .tryon-main {
        grid-template-columns: 1fr;
    }
    
    .tshirt-panel {
        position: static;
    }
    
    .tshirt-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}

@media (max-width: 576px) {
    .tshirt-grid {
        grid-template-columns: repeat(3, 1fr);
    }
    
    .control-row {
        flex-direction: column;
    }
    
    .action-buttons {
        flex-direction: column;
    }
    
    .action-btn {
        width: 100%;
        justify-content: center;
    }
}

/* Loading Animation */
.loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 100;
    border-radius: 15px;
}

.loading-overlay.active {
    display: flex;
}

.loading-spinner {
    width: 60px;
    height: 60px;
    border: 5px solid #f3f3f3;
    border-top: 5px solid #ff3f6c;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loading-text {
    margin-top: 15px;
    color: #333;
    font-weight: 600;
}
</style>
</head>
<body>
