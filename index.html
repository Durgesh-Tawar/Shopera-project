<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOPERA - Fashion Store</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="logo">SOPERA</div>

    <div class="nav-search">
        <input type="text" id="searchBar" placeholder="Search products...">
    </div>

    <!-- Hamburger icon for mobile -->
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="mood.html">Mood</a></li>
        <li><a href="reels.html">Reels</a></li>
        <li><a href="spin.html">Spin & Win 🎁</a></li>
        <li><a href="cart.html">Cart 🛒</a></li>
        <li><a href="orders.html">Orders 📦</a></li>
        <li><a href="#">Profile 👤</a></li>
    </ul>
</nav>

<!-- Hero Section -->
<section class="hero">
    <h1>Upgrade Your Style</h1>
    <p>Discover Trending Fashion</p>
    <a href="#products"><button class="hero-btn">Shop Now</button></a>
</section>

<!-- Categories & Products -->
<section class="products" id="products">
    <h2>Trending Products</h2>

    <div class="category-tabs">
        <button class="tab-btn active" data-category="all">All</button>
        <button class="tab-btn" data-category="men">Men</button>
        <button class="tab-btn" data-category="women">Women</button>
        <button class="tab-btn" data-category="kids">Kids</button>
    </div>

    <div class="product-grid" id="productGrid">
        <!-- JS will render products here -->
    </div>
</section>

<!-- Footer -->
<footer>
    <p>© 2026 SOPERA | All Rights Reserved</p>
</footer>

<!-- Scripts -->
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
    // Hamburger toggle
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');

    hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
    });
</script>

</body>
</html>
